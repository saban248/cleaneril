<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{company_name}}</title>
    <link rel="stylesheet" href="/static/css/manager.css">
    <link rel="stylesheet" href="/static/css/home.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/images/favicon-16x16.png">
    <link rel="shortcut icon" href="/static/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="dashbord-page">
        {% include "dashboard/cards.html" %}
        {% include "dashboard/links.html" %}
        {% include "dashboard/social.html" %}
    </div>
    <div class="dashboard-menu">
        <div class="menu-items">
            <div class="menu-item master">
                <i class="icon " style="width: 32px;" onclick="openMenuGeneral()">
                    {% include "icon/menu.svg" %}
                </i>
            </div>
            <div class="menu-item">
                <i class="icon icon-24" onclick="switchPageManager(PageManager.CARDS)">
                    {% include "icon/add-card.svg" %}
                </i>
            </div>
            <div class="menu-item">
                <i class="icon icon-24" onclick="switchPageManager(PageManager.SOCIAL)">
                    {% include "icon/social.svg" %}
                </i>
            </div>
            <div class="menu-item">
                <i class="icon icon-24" onclick="switchPageManager(PageManager.LINKS)">
                    {% include "icon/link.svg" %}
                </i>
            </div>
        </div>
    </div>

</body>
<script src="/static/js/all.js"></script>
<script src="/static/js/protocol.js"></script>
<script src="/static/js/manager.js"></script>
<script src="/static/js/cache.js"></script>
</html>
