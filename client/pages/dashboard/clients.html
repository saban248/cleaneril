<div class="dashboard-page" id="CLIENTS">
    <div class="page-head">
        <h2>הזמנות - ניהול  סגירות</h2>
    </div>

    <div class="page-body">
        <div id="macs" class="menu-actions-clients">
            <div class="create-card" onclick="initSelectOrderTypeToCreate()">
               <i class="fa-solid fa-circle-plus"></i>
            </div>
            <div class="filter-item">
                <span class="filter-label">
                    <i class="fa-solid fa-filter"></i>
                    סינון 
                </span>
                <span class="viewFilterSelected" id="viewOrderStatFilter" onclick="switchFilterOptions('mf-cs')">הכל</span>
                <div class="filter-options" id="mf-cs">
                    <div class="filter-option" onclick="selectClientsState(StateOrder.DONE, this)" data-s="8"> 
                       <i class="fa-solid fa-clipboard-check"></i>
                        <span>הושלם</span>
                    </div>
                    <div class="filter-option" onclick="selectClientsState(StateOrder.CLOSED, this)" data-s="2"> 
                        <i class="fa-solid fa-hourglass-half"></i>
                        <span>בהמתנה</span>
                    </div>
                    <div class="filter-option" onclick="selectClientsState(StateOrder.WAIT, this)" data-s="1"> 
                        <i class="fa-solid fa-question ac3"></i>
                        <span>לא נסגר</span>
                    </div>                    
                    <div class="filter-option" onclick="selectClientsState(StateOrder.CANCELED, this)" data-s="4"> 
                        <i class="fa-solid fa-ban ac4"></i>
                        <span>בוטל</span>
                    </div>
                </div>
            </div>
            <div class="action-search">
                <i class="fa-solid fa-circle-xmark" style="display: none;" onclick="closeSearchClients(this)"></i>
                <i class="fa-solid fa-magnifying-glass" onclick="openSearchInput('searchClient', this)"></i>
                <input class="c-input-fn seacrh-input" type="text" placeholder="שם, פאלפון, תאריך" id="searchClient" oninput="doSearchClientsLocal(this)">
            </div>
        </div>
            <div class="view-tabs-clients" id="viewtabs-items">
                <button class="view-tab-btn active" id="viewtab-1" onclick="switchClientsView(clientsView.ORDERS)">
                    <i class="fa-solid fa-list"></i>
                    הכל 
                </button>
                <button class="view-tab-btn" id="viewtab-2" onclick="switchClientsView(clientsView.TIMELINE)">
                    <i class="fa-solid fa-people-group"></i>
                    לו"ז 
                </button>
                <button class="view-tab-btn" id="viewtab-4" onclick="switchClientsView(clientsView.TRASH)">
                    <i class="fa-solid fa-trash"></i>
                    אשפה 
                </button>
            </div>
        <div class="cleaneril-list list-clients" id="listClients">
            <i class="icon icon-64" id="iel-orders-main">
                {% include "icon/empty-list.svg" %}
            </i>
        </div>
        
        <div class="workers-schedule-container" id="workersScheduleView">
            <div class="schedule-content" id="scheduleContent">
                <div class="schedule-empty-state" id="scheduleContentEmpty">
                    <i class="fa-solid fa-calendar"></i>
                    <span>אין הזמנות היום</span>
                </div>

                <div class="schedule-timeline" id="scheduleCTimeline">

                    <div class="schedule-card-slider" id="scsItems">
                    </div>
                </div>
            </div>
        </div>
        <div class="cleaneril-list list-clients" id="listOrdersTrash"></div>
        
    <div id="clientMenu" class="client-menu-action">
        
    </div>
    </div>
    <div class="main-edit-client" id="client-editor">
        <div class="ce-head">
            <i class="fa-solid fa-circle-xmark" onclick="closeClientDashboard()"></i>
            <div class="main-client-dashbaord-card-action">
                <div class="client-card-action" id="clientCardAViews">
                    <i class="fa-solid fa-file-invoice" onclick="switchViewClientDashboard(clientCardsView.ORDER)" id="cdv1"></i>
                    <i class="fa-solid fa-receipt" onclick="switchViewClientDashboard(clientCardsView.RECEIPT)" id="cdv2"></i>
                    <i class="fa-solid fa-chart-column" id="cdv4" onclick="switchViewClientDashboard(clientCardsView.REPORTS)"></i>
                </div>
                <div class="client-card-action show" id="actionIntoCard">
                    <i class="fa-solid fa-circle-chevron-right" onclick="switchViewClientDashboard(null, true, true)" id="arfc"></i>
                    <span class="border-left"></span>
                    <i class="fa-solid fa-share-from-square" id="asrp" onclick="shareReceiptToClientAsPhoto()"></i>
                    <i class="fa-solid fa-share-from-square" onclick="shareOrderToClientAsPhoto()" id="asop"></i>
                    <i class="fa-solid fa-pencil" onclick="editExistOrder()" id="aeeo"></i>
                    <i class="fa-solid fa-pencil" onclick="editReceiptOrder()" id="aero"></i>
                    <i class="fa-solid fa-file-circle-plus" id="acoi" onclick="createReceiptFromDashbaord()"></i>
                    <i class="fa-solid fa-clone" id="adco" onclick="initDuplicateCleanOrder()"></i>
                    <i class="fa-solid fa-trash-can" id="adoc" onclick="deleteOrderFromDashhbaord()"></i>
                    <i class="fa-solid fa-trash-can" id="adro" onclick="deleteReceiptFromDashbaord()"></i>
                    <i class="fa-solid fa-xmark" id="acero" onclick="closeEditReceiptOrder()"></i>
                    <i class="fa-solid fa-user-xmark ctype-4" onclick="publisCleanOrderFromDashboard(StateOrder.CANCELED)" id="apcocan"></i>
                    <i class="fa-solid fa-person-circle-question ctype-1" onclick="publisCleanOrderFromDashboard(StateOrder.WAIT)" id="apcow"></i>
                    <i class="fa-solid fa-user-clock ctype-2" onclick="publisCleanOrderFromDashboard(StateOrder.CLOSED)" id="apcoc"></i>
                    <i class="fa-solid fa-user-check ctype-8" onclick="publisCleanOrderFromDashboard(StateOrder.DONE)" id="apcod"></i>
                </div>
            </div>
        </div>
        <div class="ce-body" id="client-template-dashboard">
        </div>    </div>
    
</div>

<div id="calanderClients" class="calander-clients-menu"></div>
<div id="stateClients" class="calander-clients-menu"></div>
