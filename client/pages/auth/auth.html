<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{company_name}}</title>
    <link rel="stylesheet" href="/static/css/manager.css">
    <link rel="stylesheet" href="/static/css/home.css">
    

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/images/favicon-16x16.png">
    <link rel="shortcut icon" href="/static/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">


</head>
<body>
    <div class="auth-login">
        <div class="auth-box">
            <div class="auth-head">
                <i class="fa-solid fa-lock"></i>
                <span>{{company_name}} - התחברות</span>
                
            </div>
            <div class="auth-body">
                <div class="input-field">
                    <input type="text" placeholder="שם מנהל" class="auth-input" id="username">
                </div>
                <div class="input-field">
                    <input type="password" placeholder="סיסמה" class="auth-input" id="password">
                </div>
            </div>
            <div class="auth-footer">
                <button class="btn-login" onclick="doLogin()">כניסה</button>
            </div>

            <div class="extra-links">
                <a>Forgot Password?</a>
            </div>
        </div>
    </div>
    <div id="popupOverlay" class="popup-overlay hidden">
  <div class="popup">
    <button class="popup-close" id="closePopupBtn">&times;</button>
    <h2>Title here</h2>
    <p>This is a pure JavaScript popup.</p>
  </div>
</div>
</body>
<script src="/static/js/protocol.js"></script>
<script src="/static/js/manager.js"></script>
<script src="/static/js/all.js"></script>
</html>
